name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# fetch-depth: 2 everywhere the git-level check can run. actions/checkout
# defaults to depth 1, which leaves no HEAD~1, and the append-only check then
# declines to run and reports nothing — a silent non-application rather than a
# failure (F-031, sixth item). The dogfood job below fails loudly instead.
jobs:
  inventory:
    name: fixture inventory matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Derives the expected fixture set by scanning EVALS.md and SCHEMA.md and
      # compares it against the tree. Must be green at every milestone, M0
      # included: a milestone may be red, the inventory may not.
      - run: node evals/runner.mjs --inventory-only

  typecheck:
    name: typescript strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # EVALS.md section 1.3 makes test/ the permanent home for
      # implementation-level regressions that the frozen fixture inventory
      # cannot hold. Nothing ran them until M2, so every one of them gated
      # nothing: a lens reverted the M1 symlink fix on a clean copy and every CI
      # job stayed green while the unit suite went red (F-039, first item).
      - run: npm test

  evals:
    name: eval suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # E1, E2 and E3 run the fixture inventory, E4 three staleness windows, E5
      # the seven scenario suites graded offline from committed artifacts (the
      # runner never invokes an LLM, which E8/AC4 requires), E6 the cross-runtime
      # results file, E7 the README's own ten-minute path in a fresh directory,
      # and E8 the whole fixture inventory again with no network and no
      # credentials in scope. The runner prints the D-023 expiry's state on
      # every run.
      #
      # This job was red by design from M3-REVIEW-2.md section 4 until Hamza ran
      # E6 on a non-Claude runtime and committed the results file, which happened
      # on 9 September. It is green from there and a red here is now a real
      # failure, not an expected state. E7 needs npm to resolve one dependency
      # from the cache or the registry; E8's children need git on PATH and are
      # asserted to have it (F-077).
      - run: bash evals/run.sh
      - name: upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/

  dogfood:
    name: the action validates this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The M2 gate: this repository carries its own state/ ledgers (build rule
      # 2) and is validated by the very Action the kit ships, from this
      # checkout, not by a bespoke script. Until D-024 resolved F-030 this job
      # could not have been green: dsk validate . reported twenty
      # ERR_MODEL_ID errors on this repo's own ledger.
      - name: dsk validate . via the shipped action
        uses: ./
        with:
          path: "."

      # An append-only check that quietly does not apply is worse than no check,
      # because the job still reports success. This asserts the precondition
      # rather than trusting the checkout.
      - name: the append-only check must actually have applied
        run: |
          git rev-parse --verify -q HEAD~1 >/dev/null || {
            echo "::error title=dsk::no HEAD~1 in this checkout; the append-only check did not run"
            exit 1
          }
          echo "HEAD~1 present: $(git rev-parse --short HEAD~1)"

      - name: render smoke
        run: |
          npm ci --silent && npm run --silent build
          node dist/cli.js render . --out state.html
          test -s state.html
          grep -q "decision state" state.html
          # A view that reaches the network, or runs script, is not the static
          # read-only page PROJECT.md 6.2 asks for.
          ! grep -qi "<script" state.html
          ! grep -qE "https?://" state.html
          echo "render: $(wc -c < state.html) bytes, self-contained"

      - name: upload the rendered state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-html
          path: state.html
